<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الأصناف – Shawarma Basel POS</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div class="app dashboard-app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-placeholder-sm" aria-hidden="true">🥙</div>
        <div>
          <div class="sidebar-title">شاورما باسل</div>
          <div class="sidebar-subtitle">لوحة التحكم</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item" data-target="dashboard">الرئيسية</button>
        <button type="button" class="nav-item active" data-target="menu">الأصناف</button>
        <button type="button" class="nav-item" data-target="orders">الطلبات</button>
        <button type="button" class="nav-item" data-target="customers">الديون</button>
        <button type="button" class="nav-item" data-target="finance">المالية</button>
        <button type="button" class="nav-item" data-target="employees">العاملين</button>
        <button type="button" class="nav-item" data-target="reports">التقارير</button>
        <button type="button" class="nav-item" data-target="settings">الإعدادات</button>
        <button type="button" class="nav-item" data-target="contact">تواصل معنا</button>
      </nav>
    </aside>

    <div class="dashboard-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <span class="system-name-top">إدارة الأصناف</span>
        </div>
        <div class="top-bar-right">
          <span class="user-badge" id="userBadge">—</span>
          <button type="button" class="btn-logout" id="btnLogout" aria-label="خروج">🚪 خروج</button>
        </div>
      </header>

      <main class="main-content menu-content">
        <section class="menu-toolbar">
          <div class="toolbar-left">
            <button type="button" class="btn-primary" id="btnAddItem">إضافة صنف</button>
            <div class="category-filters">
              <button type="button" class="filter-btn active" data-category="all">الكل</button>
              <button type="button" class="filter-btn" data-category="shawarma">شاورما</button>
              <button type="button" class="filter-btn" data-category="drinks">مشروبات</button>
              <button type="button" class="filter-btn" data-category="extras">إضافات</button>
            </div>
          </div>
          <div class="toolbar-right">
            <input type="search" id="menuSearch" placeholder="بحث سريع..." />
          </div>
        </section>

        <section class="menu-grid" id="menuGrid"></section>

        <div class="error-area" id="errorArea" role="alert" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay hidden" id="menuModal" role="dialog" aria-labelledby="menuModalTitle" aria-modal="true">
    <div class="modal-dialog">
      <h2 class="modal-title" id="menuModalTitle">إضافة صنف جديد</h2>
      <div class="modal-body">
        <div class="form-row">
          <label for="menuName">الاسم (عربي)</label>
          <input type="text" id="menuName" />
        </div>
        <div class="form-row">
          <label for="menuNameEn">الاسم (إنجليزي)</label>
          <input type="text" id="menuNameEn" />
        </div>
        <div class="form-row">
          <label for="menuCategory">الفئة</label>
          <select id="menuCategory">
            <option value="shawarma">شاورما</option>
            <option value="drinks">مشروبات</option>
            <option value="extras">إضافات</option>
          </select>
        </div>
        <div class="form-row">
          <label for="menuPrice">السعر</label>
          <input type="number" id="menuPrice" min="0" step="0.1" />
        </div>
        <div class="form-row">
          <label>الأيقونة</label>
          <div class="icon-picker-wrap">
            <div class="icon-picker-preview" id="menuIconPreview" title="المحدد">—</div>
            <div class="icon-picker-grid" id="menuIconGrid" role="listbox" aria-label="اختر رمزاً للصنف"></div>
            <input type="hidden" id="menuIcon" />
          </div>
        </div>
        <div class="form-row">
          <label for="menuSort">الترتيب</label>
          <input type="number" id="menuSort" min="0" step="1" />
        </div>
        <p class="modal-note" id="menuModalError"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="menuModalCancel">إلغاء</button>
        <button type="button" class="btn-primary" id="menuModalConfirm">حفظ</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="priceModal" role="dialog" aria-labelledby="priceModalTitle" aria-modal="true">
    <div class="modal-dialog">
      <h2 class="modal-title" id="priceModalTitle">تحديث السعر</h2>
      <div class="modal-body">
        <div class="form-row">
          <label for="priceValue">السعر الجديد</label>
          <input type="number" id="priceValue" min="0" step="0.1" />
        </div>
        <div class="form-row">
          <label for="priceReason">سبب التعديل</label>
          <input type="text" id="priceReason" />
        </div>
        <p class="modal-note" id="priceModalError"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="priceModalCancel">إلغاء</button>
        <button type="button" class="btn-primary" id="priceModalConfirm">تحديث</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="settingsGateModal" role="dialog" aria-labelledby="settingsGateModalTitle" aria-modal="true">
    <div class="modal-dialog">
      <h2 class="modal-title" id="settingsGateModalTitle">كلمة سر مدير النظام</h2>
      <div class="modal-body">
        <p class="modal-note">الإعدادات مخصصة للمدير. أدخل كلمة السر للدخول.</p>
        <div class="form-row">
          <label for="settingsGatePassword">كلمة السر</label>
          <input type="password" id="settingsGatePassword" autocomplete="off" />
        </div>
        <p class="modal-note text-danger" id="settingsGateError" role="alert"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="settingsGateCancel">إلغاء</button>
        <button type="button" class="btn-primary" id="settingsGateConfirm">موافق</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="logoutModal" role="dialog" aria-labelledby="logoutModalTitle" aria-modal="true">
    <div class="modal-dialog">
      <h2 class="modal-title" id="logoutModalTitle">⚠ تأكيد الخروج</h2>
      <div class="modal-body">
        <p>هل أنت متأكد من الخروج من النظام؟</p>
        <p class="modal-note">ملاحظة: سيتم إنهاء الجلسة الحالية فقط. التطبيق سيبقى مفتوحاً.</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="logoutCancel">إلغاء</button>
        <button type="button" class="btn-danger" id="logoutConfirm">تأكيد الخروج</button>
      </div>
    </div>
  </div>

  <script src="js/modal-global.js"></script>
  <script type="module" src="js/icons.js"></script>
  <script src="js/ui-sidebar.js"></script>
  <script src="js/settings-gate.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
