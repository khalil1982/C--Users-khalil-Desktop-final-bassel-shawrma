<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول – Shawarma Basel POS</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="logo-area">
        <div class="logo-placeholder" aria-hidden="true">
          <img src="../../assets/icon.svg" alt="" class="logo-icon" onerror="this.outerHTML='<span class=\'logo-icon\'>🥙</span>'">
        </div>
        <h1 class="system-name">Shawarma Basel POS</h1>
        <p class="system-subtitle">نظام إدارة مطعم شاورما</p>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" autocomplete="username" dir="rtl">
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" dir="rtl">
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="إظهار كلمة المرور">
              <span class="password-toggle-icon">👁️</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">دخول</button>
        <div class="error-area" id="errorArea" role="alert" aria-live="polite"></div>
      </form>

      <p class="hint">اضغط Enter لتسجيل الدخول</p>
    </div>

    <!-- Personal Info Section -->
    <div class="personal-info-card">
      <h3 class="personal-info-title">بيانات مبرمج النظام</h3>
      <div class="personal-info-content">
        <div class="info-item">
          <img src="assets/icons/user.svg" alt="" class="info-icon" onerror="this.style.display='none'">
          <span class="info-label">الاسم:</span>
          <span class="info-value">خليل إبراهيم الحلبي</span>
        </div>
        <div class="info-item">
          <img src="assets/icons/phone.svg" alt="" class="info-icon" onerror="this.style.display='none'">
          <span class="info-label">الهاتف:</span>
          <span class="info-value">0599243972</span>
        </div>
        <div class="info-item">
          <img src="assets/icons/whatsapp.svg" alt="" class="info-icon" onerror="this.style.display='none'">
          <span class="info-label">واتساب:</span>
          <span class="info-value">00972599243972</span>
        </div>
        <div class="info-item">
          <img src="assets/icons/email.svg" alt="" class="info-icon" onerror="this.style.display='none'">
          <span class="info-label">البريد الإلكتروني:</span>
          <span class="info-value">khalil19823@gmail.com</span>
        </div>
      </div>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
